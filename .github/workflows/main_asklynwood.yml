# Build and deploy asksaira to the Lynwood App Service (asklynwood).
#
# Per-city pattern (same as heyburbank): this workflow lives on, and is triggered by pushes to,
# the dedicated `lynwood` branch. Create that branch from the latest asksaira, drop this file in,
# and pushes to it deploy to the `asklynwood` App Service in rglynwood.
#
# ONE-TIME SETUP before the first run:
#   - In the Azure portal, open the asklynwood App Service -> Get publish profile, and add it as a
#     GitHub Actions secret named AZUREAPPSERVICE_PUBLISHPROFILE_ASKLYNWOOD (repo or lynwood env).
#   - (Alternative, matching heyburbank's OIDC path instead of a publish profile: create a federated
#     credential for asklynwood and swap the deploy step for azure/login@v2 with client/tenant/
#     subscription id secrets. Publish profile is used here because it is a single secret.)
#
# City-specific *settings* (CITY_NAME, CODE_INDEX, AZURE_SEARCH_*, PERMITS_API_BASE, route gates,
# ...) are NOT set here; they are App Service Application Settings. Easiest path: copy an existing
# city's settings (Burbank/Lomita) and change the Lynwood-specific ones. Two gotchas: keep
# PLANNING_ROUTE_ENABLED/ZONING_ROUTE_ENABLED off (planning.py hardcodes a Burbank doclib list), and
# permit per-city facts (statuses, module->department, valuation field) live in permit_client.py,
# not env. See memory project-lynwood-onboarding.

name: Build and deploy Python app to Azure Web App - asklynwood

on:
  push:
    branches:
      - lynwood
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'asklynwood'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ASKLYNWOOD }}
